[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vanalysis"
version = "0.1.0"
description = "Public Nix-native analysis of hololive chatting-stream speech (v1: measures only)."
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
